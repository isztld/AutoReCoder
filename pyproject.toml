[project]
name = "autorecoder"
version = "0.1.0"
description = "Autonomous C/C++ to Rust code migration system"
requires-python = ">=3.11"
dependencies = [
    # HTTP and data
    "requests>=2.32.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",

    # Graph algorithms (call graph analysis)
    "networkx>=3.3",

    # C/Rust AST parsing via tree-sitter
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-rust>=0.23.0",

    # Testing
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

# System dependencies (must be installed separately — not pip-installable):
#   bear          - build interceptor for compile_commands.json  (brew install bear)
#   radamsa       - mutation fuzzer for corpus generation        (brew install radamsa, optional)
#   llvm >= 14    - required by c2rust build                     (brew install llvm)
#   cmake         - required by c2rust build                     (brew install cmake)
#   rustup        - Rust toolchain manager                       (rustup.rs)
#     components: rust-src, miri (rustup component add miri)
#     toolchains: nightly (rustup install nightly)

[tool.pytest.ini_options]
pythonpath = ["."]
